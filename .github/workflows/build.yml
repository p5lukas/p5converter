name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: go test -race ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Build
        run: |
          V=${GITHUB_REF_NAME:-dev}
          mkdir -p dist/linux dist/windows
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$V" -o dist/linux/p5converter .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$V" -o dist/windows/p5converter.exe .
          cp packaging/p5converter.desktop packaging/install-linux.sh dist/linux/
      - name: Bundle ffmpeg for Windows (BtbN GPL build: x264/x265/SVT-AV1, QSV, NVENC, AMF)
        run: |
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ff.zip
          cp ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe dist/windows/
          cp LICENSE dist/windows/LICENSE-p5converter.txt
          echo "ffmpeg: BtbN FFmpeg-Builds (GPL), https://github.com/BtbN/FFmpeg-Builds" > dist/windows/ffmpeg-info.txt
      - name: Package
        run: |
          cd dist
          (cd windows && zip -r ../p5converter-windows-x64.zip .)
          tar -C linux -czf p5converter-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/p5converter-windows-x64.zip
            dist/p5converter-linux-x64.tar.gz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/p5converter-windows-x64.zip
            dist/p5converter-linux-x64.tar.gz

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
