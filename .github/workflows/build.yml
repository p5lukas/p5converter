name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release-Version ohne v (z. B. 0.3.7), nur auf main – baut Image :<version> und erstellt Tag + Release (Text aus dem CHANGELOG, mit der Windows-exe)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

# Neuer Push auf denselben Pull Request: der veraltete Lauf wird abgebrochen (spart Wartezeit). Läufe auf main/dev, Tags und
# Releases werden nie abgebrochen.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # ein hängender Schritt (z. B. apt) soll nach Minuten scheitern, nicht nach Stunden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 update && sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y ffmpeg
      - run: go vet ./...
      - run: go test -race ./...
      - name: Logik von Audio und Untertitel (Node)
        run: node tools/test-trkplan.js
      - name: Qualitätsstufen (Node-Test)
        run: node tools/test-quality.js

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=branch
            type=ref,event=pr
            # main -> :latest (stabil) · dev -> :dev (Testen) · Tag/Version -> :<version>
      - name: Build image (local) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: p5converter:smoke
          build-args: |
            P5_TAG=${{ inputs.version != '' && format('v{0}', inputs.version) || (github.ref_type == 'tag' && github.ref_name || '') }}
            P5_BRANCH=${{ github.ref_type == 'branch' && github.ref_name || '' }}
            P5_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (real conversions inside the image)
        run: .github/smoke.sh p5converter:smoke
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            P5_TAG=${{ inputs.version != '' && format('v{0}', inputs.version) || (github.ref_type == 'tag' && github.ref_name || '') }}
            P5_BRANCH=${{ github.ref_type == 'branch' && github.ref_name || '' }}
            P5_COMMIT=${{ github.sha }}
          cache-from: type=gha

  # Windows-App: p5converter-setup.exe (EINE Datei mit Programm, ffmpeg und WebView2-Starter). Veröffentlicht wird sie nur vom Branch dev
  # als laufende Vorabversion "dev-latest" (feste Adresse, wird nach jedem Push auf dev ersetzt); sonst nur Bau, Test und Artefakt.
  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Version bestimmen
        shell: pwsh
        run: |
          $base = (Select-String -Path internal/version/version.go -Pattern 'Base = "([^"]+)"').Matches[0].Groups[1].Value
          "BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
          $nums = ($base -split '[.-]')[0..2] -join '.'
          "NUMVER=$nums.0" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Windows-Ressourcen (Symbol, Manifest, Version)
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres make --in windows/winres/winres.json --out rsrc --file-version "$env:NUMVER" --product-version "$env:NUMVER"
      - name: Programm bauen (ohne Konsole, ohne cgo)
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go vet ./...
          go build -trimpath -ldflags "-s -w -H=windowsgui -X github.com/p5lukas/p5converter/internal/version.Branch=${{ github.ref_name }} -X github.com/p5lukas/p5converter/internal/version.Commit=${{ github.sha }}" -o build/p5converter.exe .
      - name: ffmpeg (statisch, mit NVENC/Quick Sync/AMF) laden
        shell: pwsh
        run: |
          # Bevorzugt ffmpeg 6.1.1 (gyan.dev, Reihe wie im getesteten Docker-Image): braucht von NVIDIA nur die NVENC-Schnittstelle 12.1
          # und läuft damit mit viel mehr Treibern als die neueste Reihe (9.0 verlangt 13.1). Ersatz: neueste BtbN-Version.
          $ok = $false
          try {
            $asset = gh release view 6.1.1 -R GyanD/codexffmpeg --json assets --jq '.assets[].name' | Where-Object { $_ -match '^ffmpeg-6\.1\.1-full_build\.zip$' } | Select-Object -First 1
            if ($asset) { gh release download 6.1.1 -R GyanD/codexffmpeg -p $asset -O ffmpeg.zip; if ($LASTEXITCODE -eq 0) { $ok = $true; "ffmpeg-Paket: gyan.dev $asset" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append } }
          } catch { "gyan.dev nicht erreichbar: $_" }
          if (-not $ok) {
            $assets = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
            $pick = $assets | Where-Object { $_ -match '^ffmpeg-n[0-9.]+-latest-win64-gpl-[0-9.]+\.zip$' } | Sort-Object { [version](($_ -replace '^ffmpeg-n','') -replace '-latest.*','') } -Descending | Select-Object -First 1
            if (-not $pick) { $pick = 'ffmpeg-master-latest-win64-gpl.zip' }
            "ffmpeg-Paket (Ersatz): BtbN $pick" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            gh release download latest -R BtbN/FFmpeg-Builds -p $pick -O ffmpeg.zip
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          $bin = (Get-ChildItem ffmpeg-x -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" build\
          Copy-Item windows\ffmpeg-LICENSE.txt build\
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile build\MicrosoftEdgeWebview2Setup.exe
          & build\ffmpeg.exe -hide_banner -version | Select-Object -First 1
      - name: Server-Test unter Windows (echtes Windows, ffmpeg, Hardware-Erkennung)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\p5converter.exe -ArgumentList "--no-browser","--listen","127.0.0.1:8787","--config","$env:RUNNER_TEMP\cfg","--ffmpeg-dir","build" -PassThru
          $ok = $false
          for ($i=0; $i -lt 40; $i++) { try { $r = Invoke-RestMethod http://127.0.0.1:8787/api/info; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "Server startet nicht" }
          for ($i=0; $i -lt 60; $i++) { $r = Invoke-RestMethod http://127.0.0.1:8787/api/info; if ($r.hw.done) { break }; Start-Sleep 1 }
          "os=$($r.os) version=$($r.version)"
          $r.hw.backends | ForEach-Object { "{0}: {1} {2}" -f $_.id, (($_.codecs.PSObject.Properties | Where-Object Value | ForEach-Object Name) -join ','), $_.detail }
          if (-not $r.hw.backends[0].codecs.hevc) { throw "CPU-HEVC fehlt" }
          $fs = Invoke-RestMethod "http://127.0.0.1:8787/api/fs?path="
          "Laufwerke: $($fs.drives -join ' ')"
          if (-not $fs.drives -or $fs.drives.Count -lt 1) { throw "Keine Laufwerke gemeldet" }
          Stop-Process -Id $p.Id -Force
      - name: GUI-Test unter Windows (Fenster, Oberfläche, Schließen versteckt, zweiter Start)
        continue-on-error: true
        shell: pwsh
        run: pwsh windows/gui-test.ps1 "$PWD\build" "$PWD\gui-out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-test
          path: gui-out
          if-no-files-found: ignore
      - name: Go-Tests unter Windows (nur Information)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$PWD\build;$env:PATH"
          go test ./...
      - name: Installer bauen
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) { 'iscc' } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:BASE" "/DSourceDir=$PWD\build" windows\p5converter.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }
          Get-ChildItem build\out
      - name: Installer testen (still installieren, starten, deinstallieren)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\p5inst"
          Start-Process -FilePath build\out\p5converter-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/TASKS=" -Wait
          foreach ($f in 'p5converter.exe','ffmpeg.exe','ffprobe.exe') { if (-not (Test-Path "$dir\$f")) { throw "$f fehlt nach der Installation" } }
          & "$dir\p5converter.exe" --version
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 2
          if (Test-Path "$dir\p5converter.exe") { throw "Deinstallation hat das Programm nicht entfernt" }
      - name: Größen
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $rows = Get-ChildItem build\out\*.exe, build\*.exe | ForEach-Object { "| {0} | {1:N1} MB |" -f $_.Name, ($_.Length/1MB) }
          "### Größen`n| Datei | Größe |`n|---|---|`n" + ($rows -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: p5converter-setup
          path: build/out/p5converter-setup.exe
          if-no-files-found: error
      - name: Vorabversion "dev-latest" aktualisieren (nur Branch dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: pwsh
        run: |
          gh release delete dev-latest -R ${{ github.repository }} --cleanup-tag -y 2>$null
          gh release create dev-latest build/out/p5converter-setup.exe -R ${{ github.repository }} --target ${{ github.sha }} --prerelease --title "p5converter Windows (dev-latest)" --notes-file windows/dev-latest-notes.md

  # Eine Version, ein Release (wie bei p5assets): nur von main (Tag v* oder von Hand mit Version). Der Text kommt aus dem CHANGELOG (alle Versionen seit dem
  # letzten Release, neueste zuerst), keine automatische Liste der Pull Requests. Zum Testen von dev gibt es nur „dev-latest“ (Windows-exe).
  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release-Text aus dem CHANGELOG
        run: |
          tag="${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}"
          ver="${tag#v}"
          # letztes veröffentlichtes Release vX.Y.Z (ohne dev-latest) = Ausgangspunkt für „seit“
          prev="$(gh release list -R ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$tag" | sed 's/^v//' | sort -V | tail -1 || true)"
          sh tools/release-notes.sh "$ver" "$prev" > release-notes.md
          echo "TAG=$tag" >> "$GITHUB_ENV"
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ startsWith(env.TAG, 'v0.') }}
          files: |
            unraid/p5converter.xml

  # Zu jedem Release (z. B. v0.3.7 von main) kommt die Windows-setup.exe als Anhang dazu
  release-windows:
    needs: [windows, release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: p5converter-setup
          path: dl
      - run: gh release upload "v${{ inputs.version }}" dl/p5converter-setup.exe -R ${{ github.repository }} --clobber
